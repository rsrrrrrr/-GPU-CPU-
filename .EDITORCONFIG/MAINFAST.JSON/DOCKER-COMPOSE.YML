# ===========================================
# .editorconfig - 에디터 설정
# ===========================================

root = true

[*]
charset = utf-8
end_of_line = lf
indent_style = space
indent_size = 2
insert_final_newline = true
trim_trailing_whitespace = true
max_line_length = 100

[*.{js,css,html}]
indent_size = 2

[*.{py,pyw}]
indent_size = 4

[*.md]
trim_trailing_whitespace = false
max_line_length = 120

[*.{yml,yaml}]
indent_size = 2

[Makefile]
indent_style = tab

